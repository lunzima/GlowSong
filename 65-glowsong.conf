<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  GlowSong fontconfig rules.

  To the extent possible under law, The GlowSong Authors have waived all
  copyright and related or neighbouring rights to this file. Licensed under
  CC0 1.0 Universal; the full text is in LICENSE-CC0. Copy it, change it, ship
  it, no attribution needed.

  SPDX-License-Identifier: CC0-1.0
-->
<fontconfig>

  <!-- Monospace classification.

       fontconfig derives spacing from advance widths, so a half-width ASCII
       beside full-width ideographs comes out FC_DUAL (90), not FC_MONO (100).
       Pango accepts 90; Qt and TDE require 100 and leave the face out of their
       fixed-width lists. Neither post.isFixedPitch nor PANOSE is consulted, so
       this cannot be fixed inside the font.

       At scan time, because those lists are built from the cache. Run
       `fc-cache -f` after installing this file. -->

  <match target="scan">
    <test name="family"><string>GlowSong Mono</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>GlowSong GB Mono</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>

  <!-- Rendering.

       Up to 16px the embedded bitmaps draw, and antialiasing would blur what
       they exist to keep sharp. Above that the outlines take over with their
       own instructions, and hintfull is what runs them: hintslight would
       substitute FreeType's autohinter and discard them. -->

  <match target="font">
    <test name="family" compare="contains"><string>GlowSong</string></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>GlowSong</string></test>
    <test name="pixelsize" compare="more"><double>16.5</double></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

  <!-- Ext A is a fallback, not a family anyone selects. Appended weakly so a
       character outside CP936 resolves instead of becoming a box. -->

  <match target="pattern">
    <test name="family" compare="contains"><string>GlowSong</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>GlowSong ExtA</string>
    </edit>
  </match>

  <!-- Generic classification.

       Each face says which generic it belongs to, so that a picker filtering
       by generic finds it. Miss one and fontconfig treats it as unclassified,
       then presses it into service as some other generic.

       There is deliberately no <prefer> here. Installing a font should not
       decide what the desktop's default serif or monospace is; that is the
       user's setting to make. -->

  <alias>
    <family>GlowSong</family>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>GlowSong GB</family>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>GlowSong ExtA</family>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>GlowSong Mono</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>GlowSong GB Mono</family>
    <default><family>monospace</family></default>
  </alias>

  <!-- Old family names. Documents and pages that hard-code them are common
       enough that without these the font may as well not be installed. -->

  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowSong</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowSong</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>NSimSun</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowSong Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>新宋体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowSong Mono</string>
    </edit>
  </match>

</fontconfig>
