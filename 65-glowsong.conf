<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  GlowSong fontconfig rules.

  To the extent possible under law, The GlowSong Authors have waived all
  copyright and related or neighbouring rights to this file. Licensed under
  CC0 1.0 Universal; the full text is in LICENSE-CC0. Copy it, change it, ship
  it, no attribution needed.

  SPDX-License-Identifier: CC0-1.0
-->
<fontconfig>

  <match target="font">
    <test name="family" compare="contains"><string>GlowSong</string></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>

  <match target="font">
    <test name="family" compare="contains"><string>GlowSong</string></test>
    <test name="pixelsize" compare="more"><double>16.5</double></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>GlowSong</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>GlowSong ExtA</string>
    </edit>
  </match>

  <alias>
    <family>serif</family>
    <prefer><family>GlowSong</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>GlowSong Mono</family></prefer>
  </alias>

  <alias>
    <family>GlowSong</family>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>GlowSong GB</family>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>GlowSong ExtA</family>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>GlowSong Mono</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>GlowSong GB Mono</family>
    <default><family>monospace</family></default>
  </alias>

  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowSong</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowSong</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>NSimSun</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowSong Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>新宋体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowSong Mono</string>
    </edit>
  </match>

</fontconfig>
